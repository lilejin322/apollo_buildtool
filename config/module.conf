[url]
metadata=https://apollo-pkg-beta.cdn.bcebos.com/apollo/core/dists/bionic/main/binary-amd64/Packages
head=https://apollo-pkg-beta.cdn.bcebos.com/apollo/core
offline_metadata=/opt/apollo/neo/share/buildtool/Packages
offline_cyberfile_repo=/opt/apollo/neo/share/buildtool/cyberfile

[decider]
targets=/opt/apollo/neo/share/buildtool/targets
results=/opt/apollo/neo/share/buildtool/results
cyberfile_source=/opt/apollo/neo/share/buildtool/cyberfile_source

[base]
external_path=/usr/include
apollo_root=/opt/apollo/neo
apollo_package_path=/opt/apollo/neo/packages
deprecated_package_path=packages
apollo_lib_path=/opt/apollo/neo/lib
apollo_include_path=/opt/apollo/neo/include

source_path_prefix=src
binary_path_prefix=bin
include_path_prefix=include
library_path_prefix=lib
package_meta_prefix=share/packages
config_path_prefix=share

[build-tool]
path=/opt/apollo/neo/packages/buildtool
version=1.0.0.12

[packages]
special_wrapper=common-msgs

[compile]
march=-march=native
